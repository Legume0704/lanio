name: Build and Push Docker Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      image-tag:
        description: Image tag to publish for the manual test
        required: true
        default: test
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' }}

jobs:
  tag:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      pr-tag: ${{ steps.pr.outputs.pr_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Get image tag
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.image-tag }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ ! "$INPUT_TAG" =~ ^[a-z0-9_][a-z0-9_.-]{0,127}$ ]]; then
              echo "Invalid image tag: $INPUT_TAG" >&2
              exit 1
            fi
            tag="$INPUT_TAG"
            version=""
          else
            version=$(grep '^version' Cargo.toml | head -1 | sed 's/.*= *"\(.*\)"/\1/')
            tag="v$version"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Get pull request image tag
        id: pr
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # pr-image-tag.sh holds the pull request number and branch name to
          # Docker tag rule, shared with the cleanup job.
          echo "pr_tag=$(scripts/pr-image-tag.sh "$PR_NUMBER" "$HEAD_REF")" >> "$GITHUB_OUTPUT"

      - name: Create tag
        if: github.event_name == 'push'
        run: |
          tag="${{ steps.version.outputs.tag }}"
          if git ls-remote --tags origin "$tag" | grep -q "$tag"; then
            echo "Tag $tag already exists, skipping."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$tag"
            git push origin "$tag"
            echo "Created tag $tag"
          fi

  build:
    runs-on: ${{ matrix.runner }}
    needs: tag
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            slug: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            slug: arm64
          - platform: linux/arm/v7
            runner: ubuntu-latest
            slug: armv7

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up QEMU
        if: matrix.platform == 'linux/arm/v7'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
        with:
          platforms: arm

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Restore Cargo cache
        id: cargo-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/lanio-cargo-${{ matrix.slug }}
          key: cargo-${{ runner.os }}-${{ matrix.slug }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'askama.toml', 'Dockerfile') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ matrix.slug }}-

      - name: Inject Cargo cache mounts
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-dir: ${{ runner.temp }}/lanio-cargo-${{ matrix.slug }}
          dockerfile: Dockerfile
          skip-extraction: ${{ steps.cargo-cache.outputs.cache-hit }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true
          cache-from: |
            type=gha,scope=${{ matrix.slug }}
            type=registry,ref=${{ env.IMAGE_NAME }}:buildcache-${{ matrix.slug }}
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache-${{ matrix.slug }},mode=max,compression=zstd,ignore-error=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: digests-${{ matrix.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish image
    runs-on: ubuntu-latest
    needs: [tag, build]
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            ${{ needs.tag.outputs.pr-tag && format('type=raw,value={0}', needs.tag.outputs.pr-tag) || '' }}
            ${{ github.event_name != 'pull_request' && format('type=raw,value={0}', needs.tag.outputs.tag) || '' }}
            ${{ github.event_name == 'push' && 'type=raw,value=latest' || '' }}

      - name: Create and push multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE_NAME}@sha256:%s " *)

      - name: Summarise pull request image
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_TAG: ${{ needs.tag.outputs.pr-tag }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          {
            echo "## Test this pull request on real hardware"
            echo
            echo "Lanio $VERSION from \`$HEAD_REF\` is published as \`$IMAGE_NAME:$PR_TAG\`."
            echo
            echo '```sh'
            echo "docker run --rm -p 8078:8078 \\"
            echo "  -v /path/to/media:/media:ro \\"
            echo "  --env-file .env \\"
            echo "  -e BASE_URL=http://\$(hostname -I | awk '{print \$1}'):8078 \\"
            echo "  $IMAGE_NAME:$PR_TAG"
            echo '```'
            echo
            echo "Then install http://<that-host>:8078/manifest.json in Stremio and play something."
            echo "Set BASE_URL to an address Stremio can reach, or stream URLs point at localhost."
            echo
            echo "The tag is deleted from the registry when this pull request is merged or closed."
          } >> "$GITHUB_STEP_SUMMARY"

  cleanup-pr-image:
    name: Remove pull request image
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Delete pull request image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: scripts/remove-pr-image.sh
